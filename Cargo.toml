[workspace]
resolver = "2"
members = [
    "crates/openward-core",
    "crates/openward-registry",
    "crates/openward-medical",
    "crates/openward-disciplinary",
    "crates/openward-commissary",
    "crates/openward-visitors",
    "crates/openward-facility",
    "crates/openward-db",
    "crates/openward-server",
    "crates/openward-seed",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/MaxwellIsaacs/openward"

[workspace.dependencies]
# Core
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }

# Hashing (audit trail)
sha2 = "0.10"

# Password hashing
argon2 = { version = "0.5", features = ["std"] }

# Web server
axum = "0.8"
tower-http = { version = "0.6", features = ["trace", "fs"] }
askama = "0.14"
askama_web = { version = "0.14", features = ["axum-0.8"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CSV export
csv = "1"

# i18n
fluent-templates = "0.11"
regex = "1"
unic-langid = "0.9"
toml = "0.8"

# Demo seed deps
clap = { version = "4", features = ["derive"] }
rand = "0.8"

# Internal crates
openward-core = { path = "crates/openward-core" }
openward-registry = { path = "crates/openward-registry" }
openward-medical = { path = "crates/openward-medical" }
openward-disciplinary = { path = "crates/openward-disciplinary" }
openward-commissary = { path = "crates/openward-commissary" }
openward-visitors = { path = "crates/openward-visitors" }
openward-facility = { path = "crates/openward-facility" }
openward-db = { path = "crates/openward-db" }
openward-server = { path = "crates/openward-server" }
