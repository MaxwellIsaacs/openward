[workspace]
resolver = "2"
members = [
    "crates/openward-core",
    "crates/openward-registry",
    "crates/openward-medical",
    "crates/openward-disciplinary",
    "crates/openward-commissary",
    "crates/openward-visitors",
    "crates/openward-facility",
    "crates/openward-db",
    "crates/openward-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/openward/openward"

[workspace.dependencies]
# Core
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# Hashing (audit trail)
sha2 = "0.10"

# Internal crates
openward-core = { path = "crates/openward-core" }
openward-registry = { path = "crates/openward-registry" }
openward-medical = { path = "crates/openward-medical" }
openward-disciplinary = { path = "crates/openward-disciplinary" }
openward-commissary = { path = "crates/openward-commissary" }
openward-visitors = { path = "crates/openward-visitors" }
openward-facility = { path = "crates/openward-facility" }
openward-db = { path = "crates/openward-db" }
