<article>
  <header>{{ t.get("court-form-title") }}</header>
  <form hx-post="/detainees/{{ detainee_id }}/schedule-court-date"
        hx-target="#action-target">

    <label>
      {{ t.get("court-form-date") }}
      <input type="date" name="scheduled_date" required>
    </label>

    <label>
      {{ t.get("court-form-court-name") }}
      <input type="text" name="court_name" required>
    </label>

    <label>
      {{ t.get("court-form-purpose") }}
      <select name="purpose" required>
        <option value="">{{ t.get("form-select") }}</option>
        <option value="FirstAppearance">{{ t.get("legal-court-first-appearance") }}</option>
        <option value="BailHearing">{{ t.get("legal-court-bail-hearing") }}</option>
        <option value="RemandReview">{{ t.get("legal-court-remand-review") }}</option>
        <option value="TrialHearing">{{ t.get("legal-court-trial") }}</option>
        <option value="Sentencing">{{ t.get("legal-court-sentencing") }}</option>
        <option value="AppealHearing">{{ t.get("legal-court-appeal") }}</option>
        <option value="Other">{{ t.get("legal-court-other") }}</option>
      </select>
    </label>

    <label>
      {{ t.get("form-notes") }}
      <textarea name="notes" rows="3"></textarea>
    </label>

    <div class="form-actions">
      <button type="submit">{{ t.get("form-submit") }}</button>
      <button type="button"
              hx-get="/detainees/{{ detainee_id }}/view"
              hx-target="body"
              class="secondary">
        {{ t.get("form-cancel") }}
      </button>
    </div>
  </form>
</article>
