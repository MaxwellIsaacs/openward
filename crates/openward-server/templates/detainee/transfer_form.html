<article class="warning">
  <header>{{ t.get("transfer-form-title") }}</header>
  <form hx-post="/detainees/{{ detainee_id }}/do-transfer"
        hx-target="#action-target">

    <p><strong>{{ t.get("transfer-form-warning") }}</strong></p>

    <label>
      {{ t.get("transfer-form-destination") }} *
      <input type="text" name="to_facility" required>
    </label>

    <label>
      {{ t.get("transfer-form-reason") }} *
      <textarea name="reason" rows="3" required></textarea>
    </label>

    <label>
      {{ t.get("transfer-form-date") }} *
      <input type="date" name="transfer_date" required>
    </label>

    <label>
      {{ t.get("transfer-form-reference") }}
      <input type="text" name="reference_number">
    </label>

    <label>
      <input type="checkbox" name="confirm_transfer" required>
      {{ t.get("transfer-form-confirm") }}
    </label>

    <div class="form-actions">
      <button type="submit" class="contrast">{{ t.get("transfer-form-submit") }}</button>
      <button type="button"
              hx-get="/detainees/{{ detainee_id }}/view"
              hx-target="body"
              class="secondary">
        {{ t.get("form-cancel") }}
      </button>
    </div>
  </form>
</article>
