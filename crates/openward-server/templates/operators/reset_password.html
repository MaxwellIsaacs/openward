{% extends "base.html" %}

{% block title %}OpenWard - {{ t.get("operators-reset-password") }}{% endblock %}

{% block content %}
<hgroup>
  <h1>{{ t.get("operators-reset-password") }}</h1>
  <p>{{ operator_name }}</p>
</hgroup>

{% if let Some(msg) = error %}
<article class="flash-error">
  <p>{{ msg }}</p>
</article>
{% endif %}

<form method="post" action="/operators/{{ operator_id }}/reset-password">
  <label>
    {{ t.get("operators-password") }}
    <input type="password" name="new_password" required>
  </label>

  <label>
    {{ t.get("operators-confirm-password") }}
    <input type="password" name="confirm_password" required>
  </label>

  <div class="actions">
    <button type="submit">{{ t.get("operators-reset-password") }}</button>
    <a href="/operators" role="button" class="secondary">{{ t.get("form-cancel") }}</a>
  </div>
</form>
{% endblock %}
